<!DOCTYPE html>
<html>
    <head>
        <title>Time Table</title>
    </head>
    <body>
        <table border="1">
            <caption>Weekly Class Schedule</caption>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Subject</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>9:00 AM - 10:00 AM</td>
                    <td>Mathematics</td>
                </tr>
                <tr>
                    <td>Tuesday</td>
                    <td>10:00 AM - 11:00 AM</td>
                    <td>Science</td>
                </tr>        
            </tbody>
        </table>

        <br>
        <table border="1">
            <caption>Weekly Class Schedule</caption>
            <thead>
                <tr>
                    <th rowspan="2">Day</th>
                    <th colspan="2">Time</th>
                </tr>
                <tr>
                    <td>9:00 AM - 10:00 AM</td>
                    <td>10:00 AM - 11:00 AM</td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>Mathematics</td>
                    <td>English</td>
                </tr>
                <tr>
                    <td rowspan="2">Tuesday</td>
                    <td>Mathematics</td>
                    <td>Science</td>
                    <tr>
                        <td>History</td>
                        <td>Geography</td>
                    </tr>                  
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Note: Every class is mandatory.</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
